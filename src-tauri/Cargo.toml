[package]
name = "wheelforge"
version = "1.0.0"
description = "WheelForge — ODrive Direct Drive Controller"
authors = ["Telks"]
license = "GPL-3.0"
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "WheelForge"
path = "src/main.rs"

[lib]
name = "wheelforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon", "devtools"] }
tauri-plugin-log = "2"
serialport = "4.7.4"
hidapi = "2.6.4"
sysinfo = "0.33"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
